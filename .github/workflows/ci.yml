name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pinned upstream Dex and apply patches
        run: scripts/prepare-source.sh

      - name: Set up Go (version from upstream go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .work/dex/go.mod
          cache-dependency-path: .work/dex/go.sum

      - name: Test
        run: scripts/test.sh
        env:
          SKIP_PREPARE: "1"

      - name: Build image (not pushed)
        run: scripts/build.sh
        env:
          SKIP_PREPARE: "1"
          IMAGE: pathops-dex:ci
          IMAGE_VERSION: ci-${{ github.sha }}

      - name: Check Dex version in image
        run: docker run --rm --entrypoint dex pathops-dex:ci version | tee /dev/stderr | grep -q "ci-${{ github.sha }}"

      # Informational scan; never blocks CI (see README "Security").
      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: pathops-dex:ci
          format: table
          exit-code: "0"
